# Correctness checks that the current sources already satisfy.
# Formatting and length rules stay off so lint does not force a rewrite.
strict: true
only_rules:
  - compiler_protocol_init
  - discarded_notification_center_observer
  - duplicate_imports
  - empty_count
  - empty_enum_arguments
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - fatal_error_message
  - force_cast
  - force_try
  - force_unwrapping
  - identical_operands
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - legacy_nsgeometry_functions
  - legacy_random
  - no_fallthrough_only
  - notification_center_detachment
  - overridden_super_call
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_void_return
  - return_arrow_whitespace
  - leading_whitespace
  - syntactic_sugar
  - toggle_bool
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - unneeded_break_in_switch
  - unused_enumerated
  - unused_optional_binding
  - void_return
  - weak_delegate
  - yoda_condition
excluded:
  - .build
  - DerivedData
  - SignedDerivedData
  - release
  - CodexUsageWidget.xcodeproj
