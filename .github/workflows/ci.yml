name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      - name: Test
        run: swift test

      - name: SwiftLint
        run: |
          set -euo pipefail
          version="0.65.1"
          archive="portable_swiftlint.zip"
          checksum="c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"
          directory="$(mktemp -d)"
          curl -fsSL -o "$directory/$archive" "https://github.com/realm/SwiftLint/releases/download/${version}/${archive}"
          echo "${checksum}  ${archive}" | (cd "$directory" && shasum -a 256 -c -)
          unzip -q "$directory/$archive" -d "$directory"
          "$directory/swiftlint" version
          "$directory/swiftlint" lint --strict

      - name: Unsigned app and widget build
        run: ./script/ci_unsigned_build.sh
